[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renquant-pipeline"
version = "0.4.0"
description = "Runtime decision-pipeline composition for RenQuant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # >=0.8.1: renquant_common.model_fingerprint (unified model_content_sha256
  # — 2026-07-01 fix for the recurring calibrator/scorer fingerprint-mismatch
  # fail-closed, 05-27/06-22/07-01). Structural dependency, not just a
  # version-range bump: below 0.8.1 this module does not exist.
  # >=0.11.0: market_calendar ALWAYS_OPEN mode (crypto RFC M2/P1, common
  # PR #27) — the crypto asset-class policy delegates its freshness clock
  # to the shared calendar UNCONDITIONALLY and fails closed below this
  # version (no local calendar fork; Codex re-review of pipeline #183).
  # Merge order: common #27 first, then this repo's crypto policy.
  # >=0.15.0: renquant_common.walk_forward_fold_selection (common PR #33) —
  # WalkForwardModelLoader delegates PIT fold eligibility/selection to the
  # canonical shared contract at module import. Structural dependency:
  # below 0.15.0 this module does not exist and the loader fails to import.
  # Merge order: common #33 first, then this repo's loader refactor.
  "renquant-common>=0.15.0,<1.0",
  "renquant-base-data>=0.1.0",
  "renquant-artifacts>=0.1.0",
  "cvxpy>=1.4",
]

# Optional extras let downstream installs pull in a specific scorer family.
# Pipeline itself does NOT import these libraries; it goes through
# renquant_common.load_scorer + entry points per RFC §"Cross-Repo Contracts".
# renquant-model is the merged GBDT + PatchTST family repo (RFC P3); the
# [gbdt] extra selects its xgboost backend.
[project.optional-dependencies]
gbdt = ["renquant-model[gbdt]>=0.1,<0.2"]
# PatchTST family inference (kernel/panel_pipeline/hf_patchtst_scorer.py
# imports HFPatchTSTRanker). The PatchTST namespace (renquant_model_patchtst)
# is shipped by the merged renquant-model distribution; the standalone
# `renquant-model-patchtst` PyPI package is a deprecated stub
# (MIGRATED_TO_renquant-model.md). The [patchtst] extra of renquant-model
# pulls in torch + transformers. Without this extra, hf_patchtst_scorer
# falls back to file-importing scripts/patchtst_hf.py from an umbrella
# checkout (rollback only).
patchtst = ["renquant-model[patchtst]>=0.1,<0.2"]
# Momentum-residual shadow lane (GOAL-7 slice 4b, model#197 F-1): the serving
# handler (kernel/panel_pipeline/momentum_residual_scorer.py) imports the
# ledger chain verification + artifact contract from renquant_model_momentum
# and the composite construction from renquant_model_common.momentum_features
# — both shipped by the base renquant-model distribution from 0.2.1 (the
# slice-2 merge, model#196); no heavy backend extra needed (numpy/pandas
# only). The import is GUARDED: without this extra (or the sibling
# renquant-model checkout on the path) the momentum_residual shadow lane
# emits a load-failure FAULT health record naming the missing dependency;
# nothing crashes and the primary path is untouched.
momentum = ["renquant-model>=0.2.1,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../renquant-common/src", "../renquant-base-data/src", "../renquant-artifacts/src", "../renquant-model/src"]
testpaths = ["tests"]
