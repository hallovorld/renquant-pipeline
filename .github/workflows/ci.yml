name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: renquant-pipeline
          # The one-sided re-pin check below compares this PR's pin file against the
          # base ref's, so the base commit must be present. depth 0 is the simple
          # correct answer; a shallow clone would make the check silently skip.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-common
          path: renquant-common
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-base-data
          path: renquant-base-data
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-artifacts
          path: renquant-artifacts
      - uses: actions/checkout@v4
        with:
          # The momentum_residual serving handler (slice 4b, model#197 F-1)
          # imports renquant_model_momentum + renquant_model_common from the
          # renquant-model distribution; source-installed below so the
          # serving-boundary suite RUNS here instead of module-skipping
          # (codex CR on #253 — a green run must not certify only the
          # absent-dependency path). Same precedent as backtesting's CI.
          repository: hallovorld/renquant-model
          path: renquant-model
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tools
        run: python -m pip install -e renquant-common -e renquant-base-data -e renquant-artifacts -e renquant-model -e renquant-pipeline pytest xgboost
      # Fail-closed guard: the momentum serving-boundary suite importorskips
      # renquant_model_momentum for machines genuinely without it — CI must
      # never be such a machine, or the suite goes vacuously green. This step
      # makes the skip condition impossible here (and fails loudly if the
      # model package ever drops off the CI path) before the full run.
      - name: Momentum serving-boundary suite must RUN (no module skip)
        working-directory: renquant-pipeline
        run: |
          python -c "import renquant_model_momentum, renquant_model_common.momentum_features; print('renquant-model importable in CI')"
          python -m pytest tests/test_momentum_residual_shadow_handler.py -q
          python -m pytest tests/test_feature_panel_export.py -q
      - name: Test
        working-directory: renquant-pipeline
        run: make test

      # A one-sided re-pin is not forbidden -- it is justifiable via a committed
      # entry in twin_repin_exceptions.json bound to both exact digest tuples. This
      # step fails only when the divergence is UNJUSTIFIED, or when a stale exception
      # is still lying around pre-authorising the next one.
      # A pin update that moves BOTH digests of a twin pair is a normal change.
      # One that moves only one BLESSES a divergence, and `make test`'s verify()
      # cannot see it -- the file and its pin moved together, so verify() is clean.
      # The only place it shows is this diff. Runs on pull_request only: on a plain
      # push there is no base ref to diff against, and inventing one would make the
      # check pass for the wrong reason.
      - name: Twin pairs — no one-sided re-pin
        if: github.event_name == 'pull_request'
        working-directory: renquant-pipeline
        run: |
          set -euo pipefail
          git show "origin/${{ github.base_ref }}:twin_pairs.json" > /tmp/base_pins.json
          # The base's EXCEPTION file too. Without it, a PR that deletes a still-
          # applicable record passes: one_sided_repins receives an empty list and has
          # nothing to report. An absent file on the base is legitimate (no exceptions
          # existed), so it becomes an empty list rather than a failure.
          git show "origin/${{ github.base_ref }}:twin_repin_exceptions.json" \
            > /tmp/base_exceptions.json 2>/dev/null || echo '{"exceptions": []}' \
            > /tmp/base_exceptions.json
          python tools/twin_pairs.py --diff-against /tmp/base_pins.json \
            --base-exceptions /tmp/base_exceptions.json
